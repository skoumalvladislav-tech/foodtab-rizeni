name: Databáze

# Testy hlídají každou změnu ve schématu. Nasazovat do databáze tohle
# workflow NEUMÍ a schválně — proč, je vysvětlené na konci souboru.
# Mezi cestami je i tenhle soubor, jinak by se úprava workflow sama
# neověřila a chyba v něm by se ukázala až u příští změny schématu.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/databaze.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/databaze.yml'

# Původně to bylo proto, že dvě nasazení naráz by si šla po krku nad
# jednou databází. Nasazení tu už není, ale skupina zůstává: dva běhy
# nad toutéž větví nic navíc neřeknou a jen zabírají běžce.
concurrency:
  group: databaze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testy:
    name: Migrace a scénáře
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Doinstalovat psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Migrace a scénáře proti PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: foodtab_test
          LANG: C.UTF-8
        run: |
          set -o pipefail
          bash supabase/tests/run.sh 2>&1 | tee vystup.txt

          # Návratový kód nestačí. run.sh posílá psql rourou přes grep
          # a sed, takže se chyba psql v návratovém kódu roury ztratí.
          # Jediný spolehlivý důkaz jsou závěrečné hlášky všech scénářů.
          # Každý nový scénář v run.sh sem musí přibýt taky, jinak by mohl
          # padat, aniž by si toho kdokoli všiml.
          chybi=0

          # Kotvíme na celý řádek. Prosté hledání "VŠECHNY KONTROLY PROŠLY"
          # by se chytlo i na hlášky z kroku 2 a 3, které ji obsahují jako
          # část, a etapa 0 by mohla spadnout nepovšimnutě.
          grep -qE '^[[:space:]]*VŠECHNY KONTROLY PROŠLY[[:space:]]*$' vystup.txt \
            || { echo "CHYBÍ hláška: VŠECHNY KONTROLY PROŠLY (etapa 0)"; chybi=1; }

          grep -q 'KROK 2' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 2"; chybi=1; }

          grep -q 'KROK 3' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 3"; chybi=1; }

          # Kotveno na celý řádek schválně, na rozdíl od dvou kontrol nad
          # tímhle. Prosté `grep -q 'KROK 2'` je totiž PODŘETĚZCOVÁ shoda
          # a chytí se i na „== KROK 23 HOTOV ==" — takže kontrola pro
          # krok 2 projde, i kdyby krok 2 spadl a doběhl jen krok 23.
          # Je to kontrola, která nemůže spadnout. Nález je v hlášení
          # docs/hlaseni/stav-2026-09-06.md; neopravuju to tady, aby se
          # tahle změna dala přečíst jako jedna věc.
          grep -qE '^[[:space:]]*== KROK 24 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 24"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 25 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 25"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 26 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 26"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 27 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 27"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 28 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 28"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 29 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 29"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 30 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 30"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 31 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 31"; chybi=1; }

          grep -qE '^[[:space:]]*== KROK 32 HOTOV[[:space:]=]*$' vystup.txt \
            || { echo "CHYBÍ hláška: KROK 32"; chybi=1; }

          if [ "$chybi" -ne 0 ]; then
            echo "Scénáře neprošly celé."
            exit 1
          fi
          echo "Všechny scénáře doběhly."

# =====================================================================
# NASAZENÍ TU SCHVÁLNĚ NENÍ. NEPŘIDÁVEJ HO ZPÁTKY.
#
# Do 7. 9. 2026 tu byly ještě dvě úlohy: `tajemstvi` (přečetla
# SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD a SUPABASE_PROJECT_REF
# a řekla, jestli jsou nastavená) a `nasazeni` (`supabase link`
# a `supabase db push --yes` po každém pushi do `main`). Odstraněné
# rozhodnutím Šéfíka.
#
# NENÍ TO PROTO, ŽE BY NEFUNGOVALY. Je to proto, že OSTRÁ DATA LEŽÍ
# V PROJEKTU `foodtab-test` (CLAUDE.md, oddíl „Prostředí"): ostrý
# projekt zatím neexistuje. Dokud to platí, znamená automatické
# nasazení tohle — stačí, aby někdo jednou přidal ta tři tajemství do
# nastavení repozitáře, což je pár kliknutí a nikomu to nepřijde
# nebezpečné, a od té chvíle každý push do `main` mění ostrý provoz.
# Bez toho, aby to kdokoli odklikl.
#
# Nebezpečná není ta úloha, nebezpečné je, že se ta pojistka dá
# odjistit omylem. Nasazuje Šéfík, ne push.
#
# Migrace se proto pouštějí ručně, z `main` a až po zelených testech:
#
#     supabase db push
#
# VRÁTIT SE TO SMÍ, AŽ bude ostrý provoz ve vlastním projektu
# (`foodtab-prod`) a `foodtab-test` bude opravdu jen test. Podmínka je
# věcná, ne kalendářní: rozhoduje, kde leží ostrá data. Rozepsaná je
# v CLAUDE.md, „Stav prací" — odstavec „Klíče pro nasazování z GitHubu".
# Do té doby ne, i kdyby to vypadalo jako opomenutí. Není.
# =====================================================================
