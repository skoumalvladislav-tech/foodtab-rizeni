name: Marketing — fronta publikací

# Naplánovaná úloha: rozeslat příspěvky, kterým nastal čas.
#
# ---------------------------------------------------------------------
# PROČ GITHUB ACTIONS, A NE VERCEL CRON
#
# Ze stejného důvodu jako u zapomenutého odchodu: Vercel na tarifu
# Hobby častý cron odmítá a blokoval by nasazení (commit 45c3a7f).
# Actions plánuje po minutách a nic to nestojí.
#
# ---------------------------------------------------------------------
# PŘESNOST JE ORIENTAČNÍ A JE TŘEBA TO ŘÍCT NAHLAS
#
# Plánovač GitHubu není budík. Ve špičce se běh odsouvá i o desítky
# minut a při velkém provozu se jednotlivá spuštění vynechávají —
# je to výslovně „best effort". Čtvrthodinový interval tedy znamená
# „zhruba do čtvrt hodiny, občas do hodiny", ne „v 11:00:00".
#
# Pro denní menu to stačí. Kdo bude potřebovat přesnost na minutu,
# potřebuje JINÝ PLÁNOVAČ, ne jiný kód — adresa se nemění, mění se
# jen to, kdo ji volá. Zmeškaný běh nic neztratí: fronta se řídí
# `planovano_na <= now()`, takže se pozdější běh o starší úlohy
# postará sám.
#
# ---------------------------------------------------------------------
# TICHÉ SELHÁNÍ JE HORŠÍ NEŽ HLASITÉ
#
# Krok skončí nenulově při čemkoli jiném než HTTP 200. Fronta, která
# mlčky nic nedělá, vypadá úplně stejně jako fronta, ve které není co
# dělat — a to je nejhorší možný stav u věci, která má chodit ven.

on:
  schedule:
    # Ne v celou a ne v půl: v kulatých časech je fronta plánovačů
    # nejdelší. Sedmá minuta každé čtvrthodiny.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Dva běhy naráz si nesmí vzít tutéž úlohu. Hlídá to sice
# `for update skip locked` v databázi, ale čekat se nemá na co —
# když ještě běží ten předchozí, tenhle se zahodí.
concurrency:
  group: marketing-fronta
  cancel-in-progress: false

jobs:
  rozeslat:
    name: Rozeslat naplánované příspěvky
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Zavolat naplánovanou úlohu
        env:
          ADRESA: ${{ secrets.APP_URL }}
          TAJEMSTVI: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # Chybějící tajemství je chyba nastavení, ne přechodný výpadek.
          if [ -z "${ADRESA:-}" ]; then
            echo "::error::Chybí secret APP_URL — adresa nasazené aplikace bez lomítka na konci, např. https://foodtab.vercel.app"
            exit 1
          fi
          if [ -z "${TAJEMSTVI:-}" ]; then
            echo "::error::Chybí secret CRON_SECRET — musí být TÁŽ hodnota jako proměnná CRON_SECRET na Vercelu"
            exit 1
          fi

          # Tělo a kód se čtou zvlášť; tajemství se nikam nevypisuje.
          # Delší limit než u zapomenutého odchodu: tahle úloha volá ven
          # a jedno odeslání trvá i vteřiny.
          KOD=$(curl -sS -o telo.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer ${TAJEMSTVI}" \
            "${ADRESA}/api/uloha/marketing-fronta")

          echo "HTTP ${KOD}"
          cat telo.json || true
          echo

          case "$KOD" in
            200) ;;
            401)
              echo "::error::401 — tajemství nesedí. CRON_SECRET v GitHub Secrets a na Vercelu musí být stejné."
              exit 1 ;;
            503)
              echo "::error::503 — na Vercelu chybí SUPABASE_SERVICE_ROLE_KEY."
              exit 1 ;;
            *)
              echo "::error::Úloha vrátila HTTP ${KOD}."
              exit 1 ;;
          esac

          # Přehled bez rozklikávání. `selhalo` je to zajímavé číslo:
          # nenulové znamená, že něco nešlo ven a zkusí se to znovu.
          shrnuti() { sed -n "s/.*\"$1\":[[:space:]]*\([0-9]*\).*/\1/p" telo.json; }
          {
            echo "Vyzvednuto úloh: $(shrnuti vyzvednuto)"
            echo "Zveřejněno: $(shrnuti zverejneno)  nanečisto: $(shrnuti nanecisto)"
            echo "K ruce: $(shrnuti rucne)  selhalo: $(shrnuti selhalo)"
          } >> "$GITHUB_STEP_SUMMARY"
