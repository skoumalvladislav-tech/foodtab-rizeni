name: Rezervace — Choice

# Naplánovaná úloha: načtení rezervací z Choice (choiceqr.com) do
# Provoz → Rezervace a akce. Choice rezervace sám neposílá (webhooky pro
# rezervace nemá), takže se Foodtab ptá každých 15 minut. Do Choice nic
# nezapisuje.
#
# Stejný vzor jako pokladna-synchronizace.yml — GitHub Actions jako
# záloha plánovače v databázi (app.planovac_ulohy, migrace
# 20261031100000; plán musí sedět, hlídá scripts/planovac.test.mjs).
# Choice dovolí jen 1 dotaz za 5 sekund — jeden běh proto načte jen
# kus a příští pokračuje, kde skončil.

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

concurrency:
  group: rezervace-choice
  cancel-in-progress: false

jobs:
  nacist:
    name: Načíst rezervace z Choice
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Zavolat naplánovanou úlohu
        env:
          ADRESA: ${{ secrets.APP_URL }}
          TAJEMSTVI: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${ADRESA:-}" ]; then
            echo "::error::Chybí secret APP_URL — adresa nasazené aplikace bez lomítka na konci."
            exit 1
          fi
          if [ -z "${TAJEMSTVI:-}" ]; then
            echo "::error::Chybí secret CRON_SECRET — musí být TÁŽ hodnota jako proměnná CRON_SECRET na Vercelu."
            exit 1
          fi

          KOD=$(curl -sS -o telo.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer ${TAJEMSTVI}" \
            "${ADRESA}/api/uloha/rezervace-choice")

          # Jen souhrnná čísla — repozitář je veřejný, log vidí kdokoli. Důvod
          # chyby u konkrétní pobočky je v appce (Rezervace → Napojení a import).
          SOUHRN=$(jq -c '{pripojeni, zpracovano, ok, chyby, preskoceno, omezeno}' telo.json 2>/dev/null || echo '(odpověď není JSON)')
          echo "HTTP ${KOD} ${SOUHRN}"

          case "$KOD" in
            200) ;;
            401)
              echo "::error::401 — tajemství nesedí. CRON_SECRET v GitHub Secrets a na Vercelu musí být stejné."
              exit 1 ;;
            *)
              echo "::error::Úloha vrátila HTTP ${KOD}."
              exit 1 ;;
          esac

          echo "${SOUHRN}" >> "$GITHUB_STEP_SUMMARY" || true
