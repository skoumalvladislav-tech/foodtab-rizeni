              format: uuid
              description: ID firmy ve FoodTabu. Mapuje se na organizations.foodtab_tenant_id.
        venue:
          type: object
          required:
            - foodtab_branch_id
          properties:
            foodtab_branch_id:
              type: string
              format: uuid
              description: ID pobočky ve FoodTabu. Mapuje se na venues.foodtab_branch_id.
        menu:
          type: object
          required:
            - kind
            - items
          properties:
            kind:
              type: string
              examples:
                - daily
            title:
              type: string
            valid_from:
              type: [string, "null"]
              format: date
            valid_to:
              type: [string, "null"]
              format: date
            currency:
              type: string
            days:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  day_date:
                    type: [string, "null"]
                    format: date
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuItem"
            items:
              type: array
              items:
                $ref: "#/components/schemas/MenuItem"
